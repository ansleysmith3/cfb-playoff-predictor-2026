name: Refresh data

on:
  schedule:
    # Tuesdays 12:00 UTC: weekend games are final and the new polls are out
    - cron: "0 12 * * 2"
  workflow_dispatch:  # lets you run it manually from the Actions tab

permissions:
  contents: write  # needed so the job can commit refreshed data
  issues: write    # needed so the job can open an issue when something fails

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Ingest from CFBD
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python -m src.ingest

      - name: Clean raw data
        run: python -m src.clean

      - name: Build features
        run: python -m src.features --year 2026

      - name: Predict playoff field
        run: python -m src.model predict

      - name: Update README with the latest prediction
        run: python -m src.report

      - name: Validate (pipeline stops here if data is bad)
        run: python -m pytest -q

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ README.md
          git diff --staged --quiet || git commit -m "Refresh data $(date -u +%F)"
          git push

      - name: Open an issue if anything above failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create pipeline-failure --color B60205 --description "Weekly refresh failed" || true
          existing=$(gh issue list --label pipeline-failure --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Failed again. Logs: $RUN_URL"
          else
            gh issue create --label pipeline-failure \
              --title "Weekly data refresh failed" \
              --body "The scheduled refresh failed, so predictions may be stale. Logs: $RUN_URL"
          fi
